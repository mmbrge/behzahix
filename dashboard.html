<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پنل کاربری | بهیکس</title>
  <meta name="description" content="پنل مشتریان، طراحان، فروشندگان و مدیریت بهیکس.">
  <meta name="theme-color" content="#07080c">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="favicon.ico">
  <link rel="preload" href="assets/fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      try { var t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
    })();
  </script>
</head>
<body data-page="dashboard">
<div class="page-glow" aria-hidden="true"></div>

<main id="main" class="dash-root">
<div class="dash" id="dash"><div class="dash-loading"><span class="logo logo--md"><span class="logo-a">BEHI</span><span class="logo-x">X</span></span><span class="spinner"></span></div></div>
</main>

<script src="assets/js/data.js" defer></script>
<script src="assets/js/core.js" defer></script>
<script src="assets/js/dashboard.js" defer></script>
<script src="assets/js/dashboard-admin.js" defer></script>
</body>
</html>
